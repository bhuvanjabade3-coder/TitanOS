[project]
name = "titan-core"
version = "0.1.0"
description = "TITAN OS core service: API, persistence, system telemetry, safety primitives"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psutil>=6.0",
    "httpx>=0.27",
    "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
titan-core = "titan.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["titan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
